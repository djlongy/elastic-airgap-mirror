# Squid allowlist for the low-side download proxy. The flow's source network may
# reach the five Elastic download hosts and nothing else. Include this file before
# any broader "http_access allow" rule.
#
# 192.0.2.0/24 is a placeholder for the network the low-side NiFi pods egress from.
acl elastic_clients src 192.0.2.0/24

acl elastic_hosts dstdomain artifacts.elastic.co
acl elastic_hosts dstdomain artifacts.security.elastic.co
acl elastic_hosts dstdomain geoip.elastic.co
acl elastic_hosts dstdomain ml-models.elastic.co
acl elastic_hosts dstdomain kibana-knowledge-base-artifacts.elastic.co

# The GeoIP index (geoip.elastic.co/v1/database) returns presigned URLs on an
# object-storage host whose name is account-specific. Read the host out of the JSON
# (jq -r '.[].url' | cut -d/ -f3 | sort -u) and put it here. Without it every GeoIP
# download is refused with HTTP 403 by this proxy.
acl elastic_geoip_storage dstdomain <object-storage-host-from-the-geoip-json>

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow elastic_clients CONNECT SSL_ports elastic_hosts
http_access allow elastic_clients CONNECT SSL_ports elastic_geoip_storage
http_access allow elastic_clients elastic_hosts
http_access deny elastic_clients
